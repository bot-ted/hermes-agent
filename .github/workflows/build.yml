name: Build and Push Ted Agent Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          # Get the full image name with SHA tag
          FULL_IMAGE="${{ steps.meta.outputs.image }}"
          SHA_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -oE 'sha-[a-f0-9]+' | head -1)
          IMAGE_WITH_SHA="${FULL_IMAGE}:${SHA_TAG}"
          
          # Pull to ensure it's cached locally, then get the exact digest
          docker pull "$IMAGE_WITH_SHA" 2>/dev/null || true
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_WITH_SHA" 2>/dev/null | cut -d@ -f2)
          
          echo "Built image: $IMAGE_WITH_SHA"
          echo "Digest (SHA256): $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "full_image=$IMAGE_WITH_SHA" >> "$GITHUB_OUTPUT"

      - name: Output summary
        run: |
          echo "## ✅ Image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.digest.outputs.full_image }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:** \`${{ steps.digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
